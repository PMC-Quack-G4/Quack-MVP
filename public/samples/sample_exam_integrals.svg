<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 820" width="650" height="820">
  <defs>
    <pattern id="grid-integrals" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <filter id="handwriting-shadow-i" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0.8" dy="0.8" stdDeviation="0.4" flood-color="#1e3a8a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Fondo de hoja cuadriculada con margen -->
  <rect width="650" height="820" fill="#fdfbf7"/>
  <rect width="650" height="820" fill="url(#grid-integrals)" opacity="0.65"/>
  <line x1="75" y1="0" x2="75" y2="820" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Encabezado manuscrito -->
  <text x="95" y="50" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="16" fill="#0f172a" font-weight="bold">
    Cálculo Integral — Parcial 2 (Camilo Vargas)
  </text>
  <text x="95" y="76" font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-size="13" fill="#475569">
    Problema: Resolver ∫ (3x + 5) / (x² + 3x + 2) dx por Fracciones Parciales
  </text>
  <line x1="95" y1="92" x2="590" y2="92" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Desarrollo manuscrito paso a paso -->
  <g font-family="'Segoe Print', 'Comic Sans MS', cursive, sans-serif" fill="#1d4ed8" font-size="18" filter="url(#handwriting-shadow-i)">
    <!-- Paso 1 -->
    <text x="95" y="150">1) Factorizar denominador:  x² + 3x + 2 = (x + 1)(x + 2)</text>

    <!-- Paso 2 -->
    <text x="95" y="225">2) Fracciones simples:  (3x + 5) / [(x + 1)(x + 2)] = A/(x + 1) + B/(x + 2)</text>

    <!-- Paso 3 -->
    <text x="95" y="300">3) Multiplicar por denominador común:  3x + 5 = A(x + 2) + B(x + 1)</text>

    <!-- Paso 4 -->
    <text x="95" y="375">4) Evaluar raíces:  Si x = -1 =&gt; 2 = A(1) =&gt; A = 2;</text>
    <text x="235" y="410">Si x = -2 =&gt; -1 = B(-1) =&gt; B = 1</text>

    <!-- Paso 5 -->
    <text x="95" y="490">5) ∫ [ 2/(x + 1) + 1/(x + 2) ] dx = 2·ln|x + 1| + ln|x + 2| + C</text>

    <!-- Recuadro de respuesta final -->
    <rect x="90" y="455" width="525" height="55" fill="none" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  </g>

  <!-- Sello de muestra -->
  <rect x="390" y="720" width="220" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="408" y="753" font-family="sans-serif" font-size="12" fill="#475569" font-weight="bold">
    QUACK SAMPLE OCR #03
  </text>
</svg>
