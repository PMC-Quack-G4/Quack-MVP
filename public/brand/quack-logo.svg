<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Quack Official Brand Rubber Duck Logo -->
  <g id="quack-duck" transform="translate(10, 10)">
    <!-- Body & Head base -->
    <!-- Head -->
    <circle cx="85" cy="50" r="38" fill="#FFE978"/>
    
    <!-- Body -->
    <path d="M 45 68 
             C 45 68, 20 85, 20 115 
             C 20 150, 55 160, 95 160 
             C 140 160, 175 145, 175 110 
             C 175 95, 160 85, 140 85 
             C 125 85, 115 75, 110 65 
             Z" 
          fill="#FFE978"/>

    <!-- Head & Body shading / tone (Amber Yellow) -->
    <path d="M 30 118 
             C 30 148, 60 158, 95 158 
             C 135 158, 168 144, 170 115 
             C 162 135, 125 148, 90 148 
             C 55 148, 35 135, 30 118 Z" 
          fill="#FFC800" opacity="0.85"/>

    <!-- Wing (Sandy Orange) -->
    <path d="M 55 105 
             C 40 108, 35 125, 42 138 
             C 52 152, 90 150, 115 132 
             C 125 122, 125 108, 110 102 
             C 90 95, 70 102, 55 105 Z" 
          fill="#F89D4F"/>

    <!-- Beak (Caramel Brown) -->
    <path d="M 52 42 
             C 42 38, 32 32, 28 35 
             C 24 38, 30 46, 36 48 
             C 28 50, 25 58, 28 62 
             C 32 65, 44 58, 52 54 Z" 
          fill="#D96B43"/>

    <!-- Eye (Gunmetal Gray dot) -->
    <ellipse cx="68" cy="45" rx="3.5" ry="5.5" fill="#3B4151"/>
  </g>
</svg>
